<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#09090b" />
    <title>GymBit — состояние тела</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
      // Применяем сохранённую тему до монтирования React, чтобы не было «вспышки» белого.
      try {
        var raw = localStorage.getItem('gymbit:settings');
        var theme = 'dark';
        if (raw) {
          var parsed = JSON.parse(raw);
          if (parsed && parsed.state && parsed.state.theme) theme = parsed.state.theme;
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
        document.documentElement.style.background = theme === 'dark' ? '#09090b' : '#fafafb';
      } catch (e) { /* noop */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
