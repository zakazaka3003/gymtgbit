server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api → FastAPI backend (контейнер `backend` в той же docker-сети).
    # Позволяет ходить через один внешний URL (Caddy / Cloudflare Tunnel / nginx vhost).
    #
    # resolver 127.0.0.11 — встроенный DNS Docker. Через переменную $backend
    # nginx делает повторные lookup'ы по TTL, а не кеширует IP при старте
    # (иначе backend перезапустится и frontend будет 502 до рестарта).
    resolver 127.0.0.11 ipv6=off valid=10s;

    location /api/ {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        set $backend_host backend;
        proxy_pass http://$backend_host:8000/healthz;
    }

    # SPA fallback: всё, что не файл — отдаём index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long cache для статики, иммутабельные имена с хэшами.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Чтобы Telegram WebApp мог открыть index в iframe.
    add_header X-Frame-Options "ALLOWALL";
}
